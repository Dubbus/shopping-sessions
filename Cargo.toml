[package]
name = "sessions"
version = "0.1.0"
edition = "2024"

# Lean on purpose: every dep is compile time, image size, and supply-chain surface.
# Zero deps: Parquet writer (src/parquet.rs), CSV scanner, hasher are all hand-rolled.
[dependencies]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# `cargo build --profile profiling` for perf/flamegraph runs
[profile.profiling]
inherits = "release"
debug = true
strip = false
