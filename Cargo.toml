[package]
name = "sessions"
version = "0.1.0"
edition = "2024"

# Lean on purpose: every dep is compile time, image size, and supply-chain surface.
# Parquet output: start with a hand-rolled writer (src/parquet.rs, todo) since the
# output tables are small; fall back to the `parquet` crate only if that bites.
[dependencies]
memmap2 = "0.9"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

# `cargo build --profile profiling` for perf/flamegraph runs
[profile.profiling]
inherits = "release"
debug = true
strip = false
